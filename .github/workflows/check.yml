name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка синтаксиса
        run: python -m py_compile nullfetch.py logos.py

      - name: Тесты
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

      - name: Линтер
        run: |
          python -m pip install --quiet ruff
          ruff check .
