name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: nullfetch version
      description: Output of `nullfetch --version`.
      placeholder: nullfetch 1.5.0
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the output of `nullfetch --no-color`.
      render: text

  - type: input
    id: system
    attributes:
      label: Distribution and terminal
      placeholder: Void Linux, xterm-256color
